name: Supabase Keepalive

on:
  schedule:
    # Runs every day at midnight UTC (0 0 * * *)
    - cron: "0 0 * * *"
  # Allows you to trigger it manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keepalive Request to Supabase
        run: |
          curl -X GET "https://ryehsunhoycigiviuupl.supabase.co/rest/v1/unit?select=unitno&limit=1" \
          -H "apikey: sb_publishable_KSECkuaRIqINH3OmBxJHlg_U_gs0y0L" \
          -H "Authorization: Bearer sb_publishable_KSECkuaRIqINH3OmBxJHlg_U_gs0y0L"
