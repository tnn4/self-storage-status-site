      <label for="sqlQuery"><strong>SQL Query:</strong></label
      ><br />
      <textarea id="sqlQuery">
WITH ranked_units AS (
    SELECT 
        moddate, custid, unitno, status, size, midate, modate, unitrate, paidtodate,
        ROW_NUMBER() OVER (
            PARTITION BY unitno 
            ORDER BY moddate DESC NULLS LAST
        ) AS rn
    FROM unit
    WHERE (modate IS NULL OR modate::date = '1899-12-30'::date)
      AND unitno IS NOT NULL 
      AND unitno != ''
)
SELECT moddate, custid, unitno, status, size, midate, modate, unitrate, paidtodate
FROM ranked_units
WHERE rn = 1
ORDER BY 
    NULLIF(REGEXP_REPLACE(unitno, '[^0-9]', '', 'g'), '')::INTEGER ASC NULLS LAST,
    unitno ASC;
    </textarea
      >
      <label for="notePad"><strong>Notepad:</strong></label
      ><br />
      <textarea id="notePad">
-- To return only the single duplicate entry with the most recent moddate per unitno, wrap your current query in a Common Table Expression (CTE) and use ROW_NUMBER() OVER (PARTITION BY unitno ORDER BY moddate DESC NULLS LAST) to filter for rn = 1.

-- 1. Universal Standard SQL Approach (Recommended)

-- Using a CTE with ROW_NUMBER() adheres to standard ANSI SQL and gives you full control over how ties are handled before applying your custom unitno sorting:
WITH duplicates AS (
    SELECT moddate, custid, unitno, status, size, midate, modate
    FROM public.unit
    GROUP BY moddate, custid, unitno, status, size, midate, modate
    HAVING COUNT(*) > 1
),
ranked_duplicates AS (
    SELECT 
        moddate, custid, unitno, status, size, midate, modate,
        ROW_NUMBER() OVER (
            PARTITION BY unitno 
            ORDER BY moddate DESC NULLS LAST
        ) AS rn
    FROM duplicates
)
SELECT moddate, custid, unitno, status, size, midate, modate
FROM ranked_duplicates
WHERE rn = 1
ORDER BY 
    NULLIF(REGEXP_REPLACE(unitno, '[^0-9]', '', 'g'), '')::INTEGER ASC NULLS LAST,
    unitno ASC;
    </textarea

    <script>
      function toggleDevView() {
        const devElement = document.getElementById("excelViewContainer");
        const btn = document.getElementById("devModeBtn");

        // If it's already visible, let the developer hide it again without a prompt
        if (devElement.style.display === "block") {
          devElement.style.display = "none";
          btn.innerText = "Enable Dev Mode";
          return;
        }

        // Prompt for the developer password
        const password = prompt("Enter developer password:");

        if (password === "dev") {
          // <-- Change your password here
          devElement.style.display = "block";
          btn.innerText = "Disable Dev Mode";
        } else if (password !== null) {
          // Ensure it doesn't alert if the user clicked "Cancel"
          alert("Incorrect password.");
        }
      }
    </script>
