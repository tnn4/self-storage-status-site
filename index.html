<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage Unit Status</title>
    <!-- PGlite -->
    <script type="module">
      import { PGlite } from "https://cdn.jsdelivr.net/npm/@electric-sql/pglite/dist/index.js";
      window.PGlite = PGlite;
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- AlaSQL for client-side SQL execution -->
    <script src="https://cdn.jsdelivr.net/npm/alasql@4"></script>

    <link rel="stylesheet" href="styles_.css" />
  </head>
  <body>
    <div class="container">
      <h2>Unit Status</h2>

      <label for="sqlQuery"><strong>SQL Query:</strong></label
      ><br />
      <textarea id="sqlQuery">
WITH ranked_units AS (
    SELECT 
        moddate, custid, unitno, status, size, midate, modate, unitrate, paidtodate, currentrent, day30, day60, day90, latefee, lien,
        (
            COALESCE(currentrent, 0) + 
            COALESCE(day30, 0) + 
            COALESCE(day60, 0) + 
            COALESCE(day90, 0) + 
            COALESCE(latefee, 0) + 
            COALESCE(lien, 0)
        ) AS balance,
        ROW_NUMBER() OVER (
            PARTITION BY unitno 
            ORDER BY moddate DESC NULLS LAST
        ) AS rn
    FROM unit
    WHERE (modate IS NULL OR modate::date = '1899-12-30'::date)
      AND unitno IS NOT NULL 
      AND unitno != ''
)
SELECT moddate, custid, unitno, status, size, midate, modate, unitrate, paidtodate, balance
FROM ranked_units
WHERE rn = 1
ORDER BY 
    NULLIF(REGEXP_REPLACE(unitno, '[^0-9]', '', 'g'), '')::INTEGER ASC NULLS LAST,
    unitno ASC;
      </textarea>

      <label for="notePad"><strong>Notepad:</strong></label
      ><br />
      <textarea id="notePad" placeholder="Scratch notes..."></textarea>

      <br />
      <button id="btnRunQuery" disabled>Syncing database...</button>

      <!-- Matrix Container -->
      <div id="unitsGridMatrix"></div>

      <!-- Colored Table Container -->
      <div id="listLayoutContainer">
        <table>
          <thead>
            <tr>
              <th>Unit</th>
              <th style="text-align: center">Status Code</th>
              <th style="text-align: right">Rate</th>
              <th style="text-align: center">Balance</th>
            </tr>
          </thead>
          <tbody id="activeUnitsTableBody">
            <tr>
              <td
                colspan="4"
                style="text-align: center; padding: 20px; color: #6c757d"
              >
                Click 'Run Query' to load rows...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="errorMsg" class="error"></div>

      <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)" disabled>Previous</button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextBtn" onclick="changePage(1)" disabled>Next</button>
      </div>

      <button id="toggleRenderDebugButton">Toggle Render Debug</button>
      <button id="devModeBtn" onclick="toggleDevView()">Enable Dev Mode</button>

      <!-- Dev / Raw Table View -->
      <div id="excelViewContainer" style="overflow-x: auto; display: none">
        <table id="resultsTable">
          <thead>
            <tr id="tableHeaders"></tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="5" style="text-align: center">
                Click 'Run Query' to load data
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <script>
        function toggleDevView() {
          const devElement = document.getElementById("excelViewContainer");
          const btn = document.getElementById("devModeBtn");

          if (devElement.style.display === "block") {
            devElement.style.display = "none";
            btn.innerText = "Enable Dev Mode";
            return;
          }

          const input = prompt("Enter developer password:");
          const pass = "dev";
          if (input === pass) {
            devElement.style.display = "block";
            btn.innerText = "Disable Dev Mode";
          } else if (password !== null) {
            alert("Incorrect password.");
          }
        }
      </script>

      <button onclick="testSupabaseConnection()">
        Test Supabase Connection
      </button>
      <button onclick="diagnoseUnitTable()">Diagnose Unit Table</button>
    </div>

    <script src="./config.js"></script>
    <script src="./index.pglite.js"></script>
    <script src="./render.js"></script>
    <script src="./status.js"></script>
    <script src="./color.js"></script>
    <script src="./initButtons.js"></script>
  </body>
</html>
