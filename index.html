      <label for="sqlQuery"><strong>SQL Query:</strong></label
      ><br />
      <textarea id="sqlQuery">
SELECT unitno, status, unitrate, paidtodate
FROM (
    SELECT 
        LOWER(TRIM(unitno)) AS unitno,
        CASE 
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'd1' THEN 1 ELSE 0 END) > 0 THEN 'd1'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'o2' THEN 1 ELSE 0 END) > 0 THEN 'o2'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'o1' THEN 1 ELSE 0 END) > 0 THEN 'o1'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'l0' THEN 1 ELSE 0 END) > 0 THEN 'l0'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'r0' THEN 1 ELSE 0 END) > 0 THEN 'r0'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'c0' THEN 1 ELSE 0 END) > 0 THEN 'c0'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'e0' THEN 1 ELSE 0 END) > 0 THEN 'e0'
            ELSE MAX(LOWER(TRIM(status)))                  
        END AS status,
        MAX(unitrate) AS unitrate,
        -- ✅ THE FIX: Returns NULL instead of 'N/A' so real dates can bubble up to the top!
        -- MAX(CASE WHEN paidtodate LIKE '%/%' OR paidtodate LIKE '%-%' THEN paidtodate ELSE NULL END) AS paidtodate
        MAX(dateToNum(paidtodate)) as paidtodate
    FROM units
    WHERE ((modate IS NULL) OR (modate LIKE '1899-12-30%') OR (modate LIKE '%1899%'))
      AND unitno IS NOT NULL
      AND unitno != ''
    GROUP BY LOWER(TRIM(unitno))
) AS clean_records
ORDER BY 
    CASE 
        WHEN unitno LIKE '0a%' THEN '0A'
        WHEN unitno LIKE '0d%' THEN '0D'
        WHEN unitno LIKE '0f%' THEN '0F'
        WHEN unitno LIKE '0g%' THEN '0G'
        WHEN unitno LIKE '0h%' THEN '0H'
        WHEN unitno LIKE '0i%' THEN '0I'
        WHEN unitno LIKE '0j%' THEN '0J'
        ELSE '' 
    END ASC,
    LENGTH(unitno) ASC, 
    unitno ASC;
    </textarea>
          <label for="notePad"><strong>Notepad:</strong></label
      ><br />
          <textarea id="notePad">
SELECT *
FROM (
    SELECT 
        LOWER(TRIM(unitno)) AS unitno,
        -- 1. Keeps your prioritized operational status logic
        CASE 
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'd1' THEN 1 ELSE 0 END) > 0 THEN 'd1'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'o2' THEN 1 ELSE 0 END) > 0 THEN 'o2'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'o1' THEN 1 ELSE 0 END) > 0 THEN 'o1'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'l0' THEN 1 ELSE 0 END) > 0 THEN 'l0'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'r0' THEN 1 ELSE 0 END) > 0 THEN 'r0'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'c0' THEN 1 ELSE 0 END) > 0 THEN 'c0'
            WHEN SUM(CASE WHEN LOWER(TRIM(status)) = 'e0' THEN 1 ELSE 0 END) > 0 THEN 'e0'
            ELSE MAX(LOWER(TRIM(status)))                  
        END AS status,
        
        -- 2. DYNAMIC DATE LOOKUP: Matches both 'MM/DD/YYYY' and 'YYYY-MM-DD' text formats safely
        MAX(CASE WHEN paidtodate LIKE '%20%' THEN paidtodate ELSE NULL END) AS paidtodate,
        
        -- 3. ADD NEW FIELDS HERE: Wrap any extra column in MAX() or ANY_VALUE() to include it dynamically!
        MAX(unitrate) AS unitrate,
        MAX(custid) AS custid,
        MAX(size) AS size
        
    FROM units
    WHERE ((modate IS NULL) OR (modate LIKE '1899-12-30%') OR (modate LIKE '%1899%'))
      AND unitno IS NOT NULL
      AND unitno != ''
    GROUP BY LOWER(TRIM(unitno))
) AS clean_records
ORDER BY 
    CASE 
        WHEN unitno LIKE '0a%' THEN '0A'
        WHEN unitno LIKE '0d%' THEN '0D'
        WHEN unitno LIKE '0f%' THEN '0F'
        WHEN unitno LIKE '0g%' THEN '0G'
        WHEN unitno LIKE '0h%' THEN '0H'
        WHEN unitno LIKE '0i%' THEN '0I'
        WHEN unitno LIKE '0j%' THEN '0J'
        ELSE '' 
    END ASC,
    LENGTH(unitno) ASC, 
    unitno ASC;
    </textarea>

<script>
  function toggleDevView() {
    const devElement = document.getElementById('excelViewContainer');
    const btn = document.getElementById('devModeBtn');
    
    // If it's already visible, let the developer hide it again without a prompt
    if (devElement.style.display === 'block') {
      devElement.style.display = 'none';
      btn.innerText = 'Enable Dev Mode';
      return;
    }

    // Prompt for the developer password
    const password = prompt("Enter developer password:");
    
    if (password === "dev") { // <-- Change your password here
      devElement.style.display = 'block';
      btn.innerText = 'Disable Dev Mode';
    } else if (password !== null) { 
      // Ensure it doesn't alert if the user clicked "Cancel"
      alert("Incorrect password.");
    }
  }
</script>
